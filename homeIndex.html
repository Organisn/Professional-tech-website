        <!--
            Bootstrap tips
            - class hierarchy: container > row > col
            - breakpoints (xs, sm, md, lg, xl, xxl) set the screen size from which a proportion is applied 
                (e.g. col-md-6 means that the column will be 6/12 of the row width starting from medium screens)
            - columns and row gutters are set on <row> tag with
                - g-{breakpoint}-{size} for both horizontal and vertical gutters
                - gx-{breakpoint}-{size} for horizontal gutters only
                - gy-{breakpoint}-{size} for vertical gutters only
                - g-0 for no gutters
            - m and p classes set the margin and padding respectively, with {breakpoint} and {size} options
                (e.g. col-md-6 p-md-3 means that the column will be 6/12 of the row width starting from medium screens, and will have a padding of 3 starting from medium screens)
                - m/p-0 for no margin/padding
                - m/p-auto for auto margin/padding
                    (s stays for start, e for end, t for top, b for bottom, x for left and right, y for top and bottom)
            - content alignment
                - text-{breakpoint}-{alignment} set the text alignment
                - align-items-{breakpoint}-{alignment} set the vertical alignment of the content in a row
                - justify-content-{breakpoint}-{alignment} set the horizontal alignment of the content in a row
                - align-self-{breakpoint}-{alignment} set the vertical alignment of a single column in a row
            - always nest content in a container
            - .container class already responsive
            - .col-{breakpoint}-auto let a column to be just as wide as its content 
                (.row-cols-auto let all row columns to be just as wide as their content)
            - nested rows and columns are possible
            - max 12 columns per row (extra columns will wrap to the next line)
            - role="group" and aria-label="..." are used for accessibility screen readers
            - fa-{xs, sm, lg, xl, 2xl} or fa-{1-10x} let you set the font awesome icons size
            - fs-{breakpoint}-{size} set a font size
        -->
