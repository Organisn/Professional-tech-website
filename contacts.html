        <script src="countryDialCodes.js"></script>
        <script>
            // Get global dial codes from external file
            const countryDialCodes = window.countryDialCodes || [];
            // Populate the prefix select element with country dial codes
            const prefixSelect = document.getElementById('prefix');
            prefixSelect.innerHTML = countryDialCodes
                .sort((a, b) => a.country.localeCompare(b.country))
                .map(({ country, code }) => `<option value="${code}" ${country === 'IT' ? 'selected' : ''}>${country} ${code}</option>`)
                .join('');

            // Initialize Bootstrap popovers
            const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
            const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl, {trigger: 'focus'}));

            // Handle form submission through email endpoint
            // REMEMBER: 
            // - Disable 2 factor auth on serving Google account
            // - Enable less secure app access
            document.getElementById('contactForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                const form = e.currentTarget;
                const name = document.getElementById('name').value.trim();
                const surname = document.getElementById('surname').value.trim();
                const host = document.getElementById('host').value.trim();
                const domain = document.getElementById('domain').value.trim();
                const mailFrom = `${host}@${domain}`;
                const prefix = document.getElementById('prefix').value;
                const number = document.getElementById('number').value.trim();
                const phoneNumber = `${prefix} ${number}`;
                const message = document.getElementById('message').value.trim();

                const payload = {
                    name,
                    surname,
                    email: mailFrom,
                    phone: phoneNumber,
                    message,
                    _subject: 'Website contact',
                    _captcha: 'false',
                    _template: 'table'
                };

                try {
                    const response = await fetch('https://formsubmit.co/ajax/emanuele.snidero@gmail.com', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error('Request failed');
                    }

                    alert('Message sent successfully. Thanks for contacting us!');
                    form.reset();
                } catch (error) {
                    console.error('Contact form send failed:', error);
                    const fallbackBody =
                        `${message}\n\n` +
                        `---\n` +
                        `Name: ${name}\n` +
                        `Surname: ${surname}\n` +
                        `Phone: ${phoneNumber}\n` +
                        `Email: ${mailFrom}`;

                    window.location.href =
                        'mailto:info@freschi.org' +
                        '?subject=' + encodeURIComponent('Website contact') +
                        '&body=' + encodeURIComponent(fallbackBody);
                }
            });
        </script>
